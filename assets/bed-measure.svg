<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="title desc"><title id="title">量床架內徑</title><desc id="desc">俯視床架，量內側寬度與內側長度。圖為量測位置示意，不代表特定商品尺寸。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M7 0 0 3.5 7 7" fill="none" stroke="#576b79" stroke-width="1.2"/></marker></defs><rect x="168" y="54" width="304" height="336" rx="10" fill="#c5b29e"/><rect x="184" y="75" width="272" height="298" rx="6" fill="#f5f4f0" stroke="#a6988a"/><rect x="208" y="94" width="105" height="58" rx="8" fill="#e7ecee" stroke="#c9d3d8"/><rect x="326" y="94" width="105" height="58" rx="8" fill="#e7ecee" stroke="#c9d3d8"/><path d="M207 178h225M207 235h225M207 292h225" stroke="#e0e2df" stroke-width="1"/><path d="M192 210h256" stroke="#576b79" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="270" y="194" width="102" height="31" fill="#f5f4f0"/><text x="320" y="215" text-anchor="middle" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#354d5b">內側寬度</text><path d="M497 84v280" stroke="#576b79" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M474 75h37M474 373h37" stroke="#a6b0b6" stroke-width="1"/><text x="522" y="204" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#354d5b"><tspan x="522">內側</tspan><tspan x="522" dy="27">長度</tspan></text><text x="320" y="433" text-anchor="middle" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#687278">量內側可用空間，特殊造型另拍照確認</text></svg>
